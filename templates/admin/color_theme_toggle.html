{% load i18n %}
<button type="button" class="theme-toggle-btn" id="theme-toggle" aria-label="{% translate 'Toggle dark mode' %}">
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
  </svg>
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <circle cx="12" cy="12" r="5"/>
    <line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
    <line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
  </svg>
  <span>{% translate 'Dark' %}</span>
</button>
<script>
  (function () {
    var root = document.documentElement;
    function saved() {
      try { return localStorage.getItem("roshan-theme"); } catch (e) { return null; }
    }
    function resolved() {
      return root.getAttribute("data-theme") ||
        (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    }
    function label() {
      var dark = resolved() === "dark";
      var btn = document.getElementById("theme-toggle");
      if (btn) btn.querySelector("span").textContent = dark ? "روشن" : "تاریک";
    }
    var t = saved();
    if (t === "light" || t === "dark") {
      root.setAttribute("data-theme", t);
    }
    var btn = document.getElementById("theme-toggle");
    if (btn) {
      btn.addEventListener("click", function () {
        var next = resolved() === "dark" ? "light" : "dark";
        root.setAttribute("data-theme", next);
        try { localStorage.setItem("roshan-theme", next); } catch (e) {}
        label();
      });
    }
    label();
  })();
</script>
