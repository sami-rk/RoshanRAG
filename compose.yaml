services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - SQLITE_PATH=/app/data/db.sqlite3
      - MEDIA_ROOT=/app/media
      - HF_HUB_DISABLE_XET=1
    volumes:
      - media:/app/media
      - data:/app/data
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - chroma

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chroma_data:/data

volumes:
  media:
  data:
  hf_cache:
  chroma_data: