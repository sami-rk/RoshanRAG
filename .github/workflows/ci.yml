name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Test core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements.txt
      - name: Collect static files
        # Populate STATIC_ROOT so the staticfiles handler has a directory to
        # serve from during the tests and stops emitting the "No directory at:
        # .../staticfiles/" warning.
        run: python manage.py collectstatic --noinput
      - name: Run core tests
        run: |
          set -eo pipefail
          python manage.py test core 2>&1 | tee core-tests.log
          # Background tasks log failures that the suite itself may not fail
          # on; treat any such message as a test failure. A healthy run emits
          # none of these markers, so any match is a swallowed failure.
          if grep -qE "Background task failed|Failed to answer question|Failed to index document|Failed to remove vector chunks|Failed to remove stored file|Exception in thread|Traceback" core-tests.log; then
            echo "::error::Background task failed during core tests"
            exit 1
          fi

  test-documents:
    name: Test documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements.txt
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run documents tests
        run: |
          set -eo pipefail
          python manage.py test documents 2>&1 | tee documents-tests.log
          # Background tasks log failures that the suite itself may not fail
          # on; treat any such message as a test failure. A healthy run emits
          # none of these markers, so any match is a swallowed failure.
          if grep -qE "Background task failed|Failed to answer question|Failed to index document|Failed to remove vector chunks|Failed to remove stored file|Exception in thread|Traceback" documents-tests.log; then
            echo "::error::Background task failed during documents tests"
            exit 1
          fi

  test-qa:
    name: Test qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements.txt
      - name: Collect static files
        run: python manage.py collectstatic --noinput
      - name: Run qa tests
        run: |
          set -eo pipefail
          python manage.py test qa 2>&1 | tee qa-tests.log
          # Background tasks log failures that the suite itself may not fail
          # on; treat any such message as a test failure. A healthy run emits
          # none of these markers, so any match is a swallowed failure.
          if grep -qE "Background task failed|Failed to answer question|Failed to index document|Failed to remove vector chunks|Failed to remove stored file|Exception in thread|Traceback" qa-tests.log; then
            echo "::error::Background task failed during qa tests"
            exit 1
          fi

  checks:
    name: Django system checks
    runs-on: ubuntu-latest
    env:
      # Run the checks under production settings so `check --deploy` actually
      # validates the security configuration instead of being skipped by DEBUG.
      DEBUG: "false"
      SECRET_KEY: ci-check-only-strong-secret-0123456789abcdef-0123456789abcdef
      ALLOWED_HOSTS: example.com
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements.txt
      - name: Run manage.py check
        run: python manage.py check
      - name: Run manage.py check --deploy
        run: python manage.py check --deploy
      - name: Check migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - name: Validate the OpenAPI schema
        run: python manage.py spectacular --validate

  js-check:
    name: JavaScript syntax and i18n check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check JS syntax
        run: |
          for file in static/landing/js/*.js; do
            node --check "$file"
          done
      - name: Check fa/en translation keys match
        run: node scripts/check-i18n-js.mjs

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t roshan:ci .

  docker-smoke:
    name: Docker production smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build the image
        run: docker build -t roshan:ci .
      - name: Create the shared network
        run: docker network create roshan-smoke-net
      - name: Run Chroma
        run: |
          docker run -d --name roshan-chroma --network roshan-smoke-net \
            -e IS_PERSISTENT=TRUE \
            -e ANONYMIZED_TELEMETRY=FALSE \
            -p 8091:8000 \
            chromadb/chroma:1.5.9
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8091/api/v2/heartbeat > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Chroma did not become healthy in time"
          docker logs roshan-chroma
          exit 1
      - name: Run the mock LLM
        run: |
          docker run -d --name roshan-mock-llm --network roshan-smoke-net \
            -v "$PWD/scripts:/scripts" \
            python:3.12-slim \
            python /scripts/mock_llm.py
      - name: Run the container in production mode
        run: |
          docker run -d --name roshan-smoke --network roshan-smoke-net -p 8099:8000 \
            -e DEBUG=false \
            -e SECRET_KEY=ci-smoke-strong-secret-0123456789abcdef \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e OPENROUTER_API_KEY=ci-smoke-dummy-key \
            -e OPENROUTER_API_BASE=http://roshan-mock-llm:8090/v1 \
            -e CHROMA_HOST=roshan-chroma \
            -e CHROMA_PORT=8000 \
            -e EMBEDDING_MODEL=sentence-transformers/all-MiniLM-L6-v2 \
            -e DJANGO_SUPERUSER_USERNAME=admin \
            -e DJANGO_SUPERUSER_PASSWORD=admin123 \
            -e HF_HUB_DISABLE_XET=1 \
            roshan:ci
      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 60); do
            # Chroma runs in this job, so /api/health/ must report it as ok.
            if curl -sf http://localhost:8099/api/health/ | grep -q '"chroma": "ok"'; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          docker logs roshan-smoke
          exit 1
      - name: Assert pages and static assets render
        run: |
          for path in / /about/ /admin/login/ /static/landing/css/landing.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099$path")
            if [ "$code" != "200" ]; then
              echo "FAILED: $path returned $code"
              exit 1
            fi
            echo "OK: $path -> $code"
          done
      - name: Assert token authentication works
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8099/api/token/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}')
          if [ "$code" != "200" ]; then
            echo "FAILED: /api/token/ returned $code"
            docker logs roshan-smoke
            exit 1
          fi
          echo "OK: /api/token/ -> $code"
      - name: Run a real RAG round trip
        run: |
          set -euo pipefail

          TOKEN=$(curl -s -X POST http://localhost:8099/api/token/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "FAILED: could not acquire an API token"
            exit 1
          fi
          echo "Acquired API token"

          DOC_JSON=$(curl -s -X POST http://localhost:8099/api/documents/ \
            -H "Authorization: Token $TOKEN" \
            -F "file=@sample_data/گزارش-فروش-سه-ماهه-اول-1403.docx")
          DOC_ID=$(echo "$DOC_JSON" | jq -r .id)
          if [ -z "$DOC_ID" ] || [ "$DOC_ID" = "null" ]; then
            echo "FAILED: document upload did not return an id"
            echo "$DOC_JSON"
            exit 1
          fi
          echo "Uploaded document id=$DOC_ID"

          STATUS=pending
          for i in $(seq 1 90); do
            STATUS=$(curl -s http://localhost:8099/api/documents/$DOC_ID/ \
              -H "Authorization: Token $TOKEN" | jq -r .status)
            if [ "$STATUS" = "ready" ]; then
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "FAILED: document indexing failed"
              docker logs roshan-smoke
              exit 1
            fi
            sleep 2
          done
          if [ "$STATUS" != "ready" ]; then
            echo "FAILED: document never reached ready"
            docker logs roshan-smoke
            exit 1
          fi
          echo "Document indexed (status=$STATUS)"

          ASK_JSON=$(curl -s -X POST http://localhost:8099/api/questions/demo_ask/ \
            -H 'Content-Type: application/json' \
            -d '{"question":"میزان فروش در سه ماهه اول چه میزان بود؟"}')
          QUESTION_ID=$(echo "$ASK_JSON" | jq -r .id)
          DEMO_TOKEN=$(echo "$ASK_JSON" | jq -r .demo_token)
          if [ -z "$QUESTION_ID" ] || [ "$QUESTION_ID" = "null" ] \
             || [ -z "$DEMO_TOKEN" ] || [ "$DEMO_TOKEN" = "null" ]; then
            echo "FAILED: demo_ask did not return a question id and token"
            echo "$ASK_JSON"
            exit 1
          fi
          echo "Asked question id=$QUESTION_ID"

          STATUS=pending
          for i in $(seq 1 60); do
            ANSWER_JSON=$(curl -s \
              "http://localhost:8099/api/questions/$QUESTION_ID/demo/?token=$DEMO_TOKEN")
            STATUS=$(echo "$ANSWER_JSON" | jq -r .status)
            if [ "$STATUS" = "done" ]; then
              break
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "FAILED: answering failed"
              echo "$ANSWER_JSON"
              docker logs roshan-smoke
              exit 1
            fi
            sleep 2
          done
          if [ "$STATUS" != "done" ]; then
            echo "FAILED: question never reached done"
            docker logs roshan-smoke
            exit 1
          fi

          ANSWER=$(echo "$ANSWER_JSON" | jq -r .answer)
          SOURCES=$(echo "$ANSWER_JSON" | jq -r '.sources | length')
          if [ -z "$ANSWER" ]; then
            echo "FAILED: answer is empty"
            exit 1
          fi
          if [ -z "$SOURCES" ] || [ "$SOURCES" = "null" ] || [ "$SOURCES" = "0" ]; then
            echo "FAILED: no grounded sources returned"
            echo "$ANSWER_JSON"
            exit 1
          fi
          echo "Answer generated with $SOURCES grounded source(s)"
          echo "OK: RAG round trip complete"
      - name: Assert no tracebacks in the logs
        run: |
          if docker logs roshan-smoke 2>&1 | grep -E "Traceback|Internal Server Error"; then
            echo "Tracebacks found in container logs"
            exit 1
          fi
          echo "No tracebacks found"