name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-core:
    name: Test core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements.txt
      - name: Run core tests
        run: python manage.py test core

  test-documents:
    name: Test documents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements.txt
      - name: Run documents tests
        run: python manage.py test documents

  test-qa:
    name: Test qa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements.txt
      - name: Run qa tests
        run: python manage.py test qa

  checks:
    name: Django system checks
    runs-on: ubuntu-latest
    env:
      # Run the checks under production settings so `check --deploy` actually
      # validates the security configuration instead of being skipped by DEBUG.
      DEBUG: "false"
      SECRET_KEY: ci-check-only-strong-secret-0123456789abcdef-0123456789abcdef
      ALLOWED_HOSTS: example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.6.0
          pip install -r requirements.txt
      - name: Run manage.py check
        run: python manage.py check
      - name: Run manage.py check --deploy
        run: python manage.py check --deploy
      - name: Check migrations are in sync
        run: python manage.py makemigrations --check --dry-run
      - name: Validate the OpenAPI schema
        run: python manage.py spectacular --validate

  js-check:
    name: JavaScript syntax and i18n check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JS syntax
        run: |
          for file in static/landing/js/*.js; do
            node --check "$file"
          done
      - name: Check fa/en translation keys match
        run: node scripts/check-i18n-js.mjs

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t roshan:ci .

  docker-smoke:
    name: Docker production smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t roshan:ci .
      - name: Run the container in production mode
        run: |
          docker run -d --name roshan-smoke -p 8099:8000 \
            -e DEBUG=false \
            -e SECRET_KEY=ci-smoke-strong-secret-0123456789abcdef \
            -e ALLOWED_HOSTS=localhost,127.0.0.1 \
            -e OPENROUTER_API_KEY= \
            -e DJANGO_SUPERUSER_USERNAME=admin \
            -e DJANGO_SUPERUSER_PASSWORD=admin123 \
            -e HF_HUB_DISABLE_XET=1 \
            roshan:ci
      - name: Wait for the app to become healthy
        run: |
          for i in $(seq 1 60); do
            # Chroma is absent in this job, so /api/health/ answers 503 once
            # the app is up. Treat any HTTP response as "the server is ready".
            if curl -s -o /dev/null http://localhost:8099/api/health/; then
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          docker logs roshan-smoke
          exit 1
      - name: Assert pages and static assets render
        run: |
          for path in / /about/ /admin/login/ /static/landing/css/landing.css; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8099$path")
            if [ "$code" != "200" ]; then
              echo "FAILED: $path returned $code"
              exit 1
            fi
            echo "OK: $path -> $code"
          done
      - name: Assert token authentication works
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST http://localhost:8099/api/token/ \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}')
          if [ "$code" != "200" ]; then
            echo "FAILED: /api/token/ returned $code"
            docker logs roshan-smoke
            exit 1
          fi
          echo "OK: /api/token/ -> $code"
      - name: Assert no tracebacks in the logs
        run: |
          if docker logs roshan-smoke 2>&1 | grep -E "Traceback|Internal Server Error"; then
            echo "Tracebacks found in container logs"
            exit 1
          fi
          echo "No tracebacks found"