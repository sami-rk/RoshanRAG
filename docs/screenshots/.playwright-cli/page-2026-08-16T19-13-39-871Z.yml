                - textbox "پاسخ:" [ref=f5e120]: "فرآیند استخدام در شرکت رُشن مطابق با دستورالعمل فرآیند استخدام کارمندان جدید به‌صورت زیر انجام می‌شود: **مرحله اول:** درخواست استخدام از طرف مدیر واحد به واحد منابع انسانی ارسال می‌شود و پس از تأیید بودجه، آگهی استخدام منتشر می‌گردد. **مرحله دوم:** رزومه‌های دریافت‌شده توسط واحد منابع انسانی غربال می‌شوند و حداکثر ۱۰ نفر برای مصاحبه تلفنی دعوت می‌شوند. **مرحله سوم:** مصاحبه فنی توسط سرپرست تیم و مصاحبه رفتاری توسط مدیر منابع انسانی انجام می‌شود. برای هر دو مصاحبه نمره‌ای از ۱۰۰ ثبت می‌گردد. **مرحله چهارم:** کاندیدایی که میانگین نمره او حداقل ۸۰ باشد برای مرحله پیشنهاد حقوق انتخاب می‌شود و پس از توافق، قرارداد امضا می‌شود. **دوره آزمایشی:** دوره آزمایشی سه ماهه است و پس از ارزیابی عملکرد، قرارداد کار به صورت دائمی تمدید خواهد شد. منابع: - دستورالعمل فرآیند استخدام"
              - generic [ref=f5e122]:
                - text: "منابع:"
                - generic [ref=f5e123]: "[{\"document_id\": 5, \"title\": \"دستورالعمل-استخدام\", \"excerpt\": \"دستورالعمل فرآیند استخدام\\nدستورالعمل فرآیند استخدام کارمندان جدید در شرکت رُشن. این سند مراحل استاندارد جذب و استخدام را شرح می‌دهد.\\nمرحله اول: درخواست استخدام از طرف مدیر واحد به واحد منابع انسانی ارسال می‌شود و پس از تأیید بودجه، آگهی استخدام منتشر می‌گردد.\\nمرحله دوم: رزومه‌های دریافت‌شده توسط واح\"}, {\"document_id\": 6, \"title\": \"سوالات-متداول\", \"excerpt\": \"سوالات متداول سامانه رُشن (RoshanRAG)\\n\\nس: سامانه رُشن چیست؟\\nج: رُشن یک سامانه پرسش از اسناد است که به شما امکان می‌دهد اسناد متنی خود را بارگذاری کنید و به زبان طبیعی از آن‌ها سوال بپرسید.\\n\\nس: چه فرمت‌هایی پشتیبانی می‌شود؟\\nج: در حال حاضر فرمت‌های DOCX و TXT پشتیبانی می‌شوند.\\n\\nس: آیا می‌توانم بیش از \"}, {\"document_id\": 7, \"title\": \"سیاست-حریم-خصوصی\", \"excerpt\": \"سیاست حریم خصوصی\\nسیاست حریم خصوصی سامانه رُشن. این سند نحوه جمع‌آوری، استفاده و حفاظت از اطلاعات کاربران را توضیح می‌دهد.\\nسامانه رُشن تنها اطلاعاتی را جمع‌آوری می‌کند که کاربر به صورت آگاهانه و اختیاری ارائه می‌دهد، مانند نام کاربری و محتوای اسناد بارگذاری‌شده.\\nاسناد بارگذاری‌شده توسط کاربران فقط بر\"}]"
